<script>
    document.addEventListener('DOMContentLoaded', () => {
        const nome = sessionStorage.getItem("nome_usuario");
        const nivel = sessionStorage.getItem("nivel_acesso");

        if (!nome || !nivel) {
            window.location.href = "login";
        }
    });
</script>

<div class="anexoexame modal-anexo-documento" style="visibility: visible; opacity: 1;">
    <div class="modal-anexo-backdrop">
        <div class="painel_dadosAnexo painel-anexo-documento">
            <form id="formAnexarExame" method="POST" enctype="multipart/form-data">
                <div class="modal-anexo-header">
                    <div>
                        <h3>Anexar exame</h3>
                        <p>Registre a data, vencimento e PDF do exame ocupacional.</p>
                    </div>
                    <button type="button" class="modal-anexo-close" id="bt_fechar_formAnexarExame" title="Fechar" aria-label="Fechar">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>

                <div class="modal-anexo-body">
                    <label class="modal-anexo-field span-2">
                        <span>Exame</span>
                        <select id="selectExame" class="cbx_teste glass info_padrao opcoes input_obrigatorio" name="exame" required>
                        </select>
                    </label>

                    <label class="modal-anexo-field span-2">
                        <span>Colaborador</span>
                        <select id="selectColaborador" class="cbx_teste glass info_padrao opcoes input_obrigatorio" name="idColab" required>
                        </select>
                    </label>

                    <label class="modal-anexo-field">
                        <span>Data realizada</span>
                        <input id="datarealizadaExame" class="tbx_teste glass" type="date" name="datarealizadaExame">
                    </label>

                    <label class="modal-anexo-field">
                        <span>Vencimento em meses</span>
                        <input class="tbx_teste glass" type="number" value="12" id="vencimentoExame" name="vencimento" min="0" step="1" required title="Informe a validade em meses.">
                    </label>

                    <div class="modal-anexo-status" id="statusVencimentoExame" aria-live="polite"></div>

                    <label class="modal-anexo-upload span-2" for="documento">
                        <input type="file" id="documento" name="documento" accept="application/pdf">
                        <i class="fa-solid fa-file-pdf"></i>
                        <span>
                            <b>Anexar PDF</b>
                            <small class="modal-anexo-file-name">Selecione o arquivo do exame, se houver.</small>
                        </span>
                    </label>
                </div>

                <div id="uploadProgressWrapper" class="modal-anexo-progress" style="display:none;">
                    <div class="progress">
                        <div id="uploadProgress" class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
                            0%
                        </div>
                    </div>
                </div>

                <div class="modal-anexo-footer">
                    <input id="bt_anexarExame" class="bt_teste btn btn-primary" data-roles="4,7,99" type="submit" name="anexarExame" value="Anexar Exame">
                    <input id="bt_fechar_formAnexarExame_footer" type="reset" value="Cancelar">
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    $(document).off("click", "#bt_fechar_formAnexarExame, #bt_fechar_formAnexarExame_footer");
    $(document).on("click", "#bt_fechar_formAnexarExame, #bt_fechar_formAnexarExame_footer", function () {
        $('#form_anexarExame').empty();
    });

    $(document).off("change", "#formAnexarExame #documento");
    $(document).on("change", "#formAnexarExame #documento", function () {
        const nomeArquivo = this.files?.[0]?.name || "Selecione o arquivo do exame, se houver.";
        $(this).closest(".modal-anexo-upload").find(".modal-anexo-file-name").text(nomeArquivo);
    });
</script>
