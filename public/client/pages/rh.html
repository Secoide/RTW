<main id="rh">
    <div class="painel_Esquerda class">
        <div class="painel_colaboradoresResumo">
            <div class="painelSubMenu">
                <div class="painelAcoes">
                    <div class="bt_submenu">
                        <div id="popup-novocolaborador" class="popup-option-menu bt_form_cad_colab" data-type="novocolaborador"
                            data-roles="4,6,7,99" title="Novo colaborador">
                            <i class="fa-solid fa-user-plus"></i> Novo colaborador
                        </div>
                    </div>
                    <div id="bt_atualizarRH" class="bt_submenu">
                        <button type="button" class="programacao-top-btn bt_atualizar" title="Atualizar tabela">
                            <i class="fa-solid fa-rotate-right"></i>
                            <span>Atualizar</span>
                        </button>
                    </div>
                    <div class="bt_submenu">
                        <button type="button" id="btnExportarRHPDF" class="programacao-top-btn" title="Exportar resumo dos colaboradores em PDF">
                            <i class="fa-solid fa-file-pdf"></i>
                            <span>PDF</span>
                        </button>
                    </div>
                </div>
                <div class="painelBuscar">
                    <div class="bt_submenu">
                        <label style="font-size: 11px; width: 150px;">
                            <input type="checkbox" id="chkDesligados">
                            Mostrar desligados
                        </label>
                    </div>
                    <div class="bt_submenu">
                        <input id="myInputPesquisaNomeRH" class="tbx_teste glass" type="text" name=""
                            placeholder="Pesquisar Colaborador..." title="pesquisa_nomeRH" class="pesquisa_nomeRH">
                    </div>
                    <button type="button" id="btnBuscaAvancadaRH" class="rh-btn-filtro" title="Abrir busca avançada">
                        <i class="fa-solid fa-sliders"></i>
                    </button>
                    <div class="rh-filtros-rapidos">
                        <button type="button" class="rh-chip ativo" data-rh-filter="todos">
                            <i class="fa-solid fa-table-list"></i> Todos
                        </button>
                        <button type="button" class="rh-chip" data-rh-filter="vencidos">
                            <i class="fa-solid fa-triangle-exclamation"></i> Vencidos
                        </button>
                        <button type="button" class="rh-chip" data-rh-filter="alerta">
                            <i class="fa-solid fa-clock"></i> A vencer
                        </button>
                        <button type="button" class="rh-chip" data-rh-filter="agendado">
                            <i class="fa-solid fa-calendar-check"></i> Agendados
                        </button>
                        <button type="button" class="rh-chip" data-rh-filter="ferias">
                            <i class="fa-solid fa-umbrella-beach"></i> Férias
                        </button>
                        <button type="button" class="rh-chip" data-rh-filter="afastados">
                            <i class="fa-solid fa-user-clock"></i> Afastados
                        </button>
                        <button type="button" class="rh-chip" data-rh-filter="epi">
                            <i class="fa-solid fa-helmet-safety"></i> EPI
                        </button>
                    </div>
                </div>

                <div class="rh-busca-avancada" id="rhBuscaAvancadaPainel">
                    <div class="rh-avancado-campo">
                        <label for="rhFiltroCargo">Cargo</label>
                        <input id="rhFiltroCargo" type="text" placeholder="Ex.: eletricista">
                    </div>
                    <div class="rh-avancado-campo">
                        <label for="rhFiltroSetor">Setor</label>
                        <input id="rhFiltroSetor" type="text" placeholder="Ex.: produção">
                    </div>
                    <div class="rh-avancado-campo">
                        <label for="rhFiltroStatus">Status</label>
                        <select id="rhFiltroStatus">
                            <option value="">Todos</option>
                            <option value="ferias">Férias</option>
                            <option value="afastamento">Afastamento</option>
                            <option value="saude">Saúde</option>
                            <option value="maternidade">Maternidade</option>
                            <option value="paternidade">Paternidade</option>
                            <option value="exame agendado">Exame agendado</option>
                            <option value="desligado">Desligado</option>
                        </select>
                    </div>
                    <button type="button" id="btnLimparFiltrosRH" class="rh-btn-limpar">
                        <i class="fa-solid fa-eraser"></i>
                        Limpar
                    </button>
                </div>

                <div class="rh-submenu-info">
                    <div class="rh-resumo-rapido" title="Resumo dos colaboradores visíveis">
                        <div class="rh-resumo-card">
                            <span id="rhResumoVisiveis">0</span>
                            <small>visíveis</small>
                        </div>
                        <div class="rh-resumo-card alerta">
                            <span id="rhResumoPendencias">0</span>
                            <small>atenção</small>
                        </div>
                        <div class="rh-resumo-card">
                            <span id="rhResumoAusentes">0</span>
                            <small>ausências</small>
                        </div>
                    </div>
                    <div class="rh-insight" id="rhInsight">
                        <i class="fa-solid fa-lightbulb"></i>
                        <span>Carregando leitura rápida do RH...</span>
                    </div>
                </div>

            </div>
            <div class="painelBuscaAvancada" id="buscaAvancado" style="display: none;">
                <form action="" style="display: flex; justify-content: space-between; width: 100%;">
                    <div class="buscaEsq">
                        <div class="bt_submenu">
                            <input type="checkbox" id="chkOSResponsável" name="OSResponsável" value="Bike">
                            <label for="chkOSResponsável" class="naoSelecionavel">OS Sem Responsável</label><br>
                        </div>
                        <div class="bt_submenu">
                            <input type="checkbox" id="chkOSParada" name="OSParada" value="Bike">
                            <label for="chkOSParada" class="naoSelecionavel">OS Parada</label><br>
                        </div>
                        <div class="bt_submenu">
                            <input type="checkbox" id="chkOSAguardando" name="OSAguardando" value="Bike">
                            <label for="chkOSAguardando" class="naoSelecionavel">OS Aguardando</label><br>
                        </div>
                        <div class="bt_submenu">
                            <input type="checkbox" id="chkOSExecucao" name="OSExecucao" value="Bike">
                            <label for="chkOSExecucao" class="naoSelecionavel">OS Em execucao</label><br>
                        </div>
                        <div class="bt_submenu">
                            <input type="checkbox" id="chkOSConcluida" name="OSConcluida" value="OS">
                            <label for="chkOSConcluida" class="naoSelecionavel">OS Concluida</label><br>
                        </div>
                    </div>
                    <div class="buscaDir">
                        <div class="bt_submenu">
                            <select id="selectClienteBuscar" name="clientes" class="bt_padrao opcoes"
                                style="width: 150px; background-color: var(--white); color: var(--texto_cinza); margin-left: 4px;">
                                <option value="" disabled selected hidden>Selecione o Cliente</option>
                            </select>
                            <select id="selectResponsavelBuscar" name="responsavel" class="bt_padrao opcoes"
                                style="width: 200px; background-color: var(--white); color: var(--texto_cinza); margin-left: 4px;">
                                <option value="" disabled selected hidden>Selecione o Responsável...</option>
                            </select>
                            <input id="btnBuscaAvancada" class="bt_padrao bt_buscar" type="button" value="Buscar">
                        </div>
                        <div class="bt_submenu">
                            <input id="btnLimpar" class="bt_padrao bt_cancel" type="button" name="" value="Limpar"
                                title="Limpar">
                        </div>
                    </div>
                </form>
            </div>
            <div class="painel_tabelaFunc">
                <div class="tb_padraoGeral">
                    <table id="tb_colaboradoresRH" class="tb_zebrada">
                        <thead class="tb_cabecalho">
                            <tr>
                                <th>ID</th>
                                <th>NOME COMPLETO</th>
                                <th>NASCIMENTO</th>
                                <th>CARGO</th>
                                <th>SETOR</th>
                                <th>EPIS</th>
                                <th>INTEGRAÇÕES</th>
                                <th>EXAMES</th>
                                <th>CURSOS (NR)</th>
                                <th>STATUS</th>
                                <th>AÇÕES</th>
                            </tr>
                        </thead>

                        <tbody class="tb_padrao_conteudo">
                            <!-- Linhas serão adicionadas via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <div class="painel_Direita class">
        <div class="painel_Exames">

        </div>
        <div class="painel_EPI">

        </div>
        <div class="painel_Integracoes">

        </div>
    </div>

</main>
