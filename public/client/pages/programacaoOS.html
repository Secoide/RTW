<div class="painel_pagina">
    <div class="painel_menuSuperior programacao-toolbar">
        <div class="programacao-toolbar-grupo programacao-toolbar-acoes">
            <button id="bt_abrir_NovaOS" type="button" data-roles="6,7,99"
                class="programacao-top-btn programacao-top-btn-primary" title="Cadastrar OS">
                <i class="fa-solid fa-plus"></i>
                <span>Nova OS</span>
            </button>
            <button id="bt_atualizarProgramacao" type="button" class="programacao-top-btn bt_atualizar" title="Atualizar programacao">
                <i class="fa-solid fa-rotate-right"></i>
                <span>Atualizar</span>
            </button>
        </div>

        <div class="programacao-toolbar-grupo programacao-toolbar-busca">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input id="programacaoBuscaGlobal" type="text" autocomplete="off"
                placeholder="Busca global. Buscar OS, cliente, cidade ou colaborador...">
            <button id="programacaoLimparBusca" type="button" title="Limpar busca">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <div class="programacao-toolbar-grupo programacao-toolbar-filtros" aria-label="Filtros da programacao">
            <button type="button" class="programacao-filter-btn" data-filtro="prioridade" title="Mostrar prioridade alta">
                <i class="fa-solid fa-flag"></i>
            </button>
            <button type="button" class="programacao-filter-btn" data-filtro="com-equipe" title="Mostrar OS com equipe">
                <i class="fa-solid fa-people-group"></i>
            </button>
            <button type="button" class="programacao-filter-btn" data-filtro="sem-equipe" title="Mostrar OS sem equipe">
                <i class="fa-regular fa-circle"></i>
            </button>
            <button type="button" class="programacao-filter-btn" data-filtro="sem-responsavel" title="Mostrar OS sem responsavel">
                <i class="fa-solid fa-user-slash"></i>
            </button>
            <button id="programacaoBuscaAvancadaToggle" type="button" class="programacao-filter-btn programacao-filter-wide"
                title="Busca avancada">
                <i class="fa-solid fa-sliders"></i>
            </button>
        </div>

        <div class="programacao-toolbar-hints" title="Atalhos para adicionar colaboradores na OS">
            <span><b>#</b> responsaveis</span>
            <span><b>$</b> terceiros</span>
        </div>

        <div class="direitaflex"></div>
        <div class="painel_EsqBtAcoes programacao-toolbar-data">
            <div class="date-wrapper">
                <label for="seletor_data" id="btnAbrirData" class="date-icon-btn">
                    <i class="fa-solid fa-calendar-days"></i>
                </label>

                <input id="seletor_data" class="tbx_data tbx_teste glass" type="date" value="">
            </div>
            <button id="btnProgramacaoAjustes" type="button" class="programacao-ajustes-btn"
                title="Ajustes da programação">
                <i class="fa-solid fa-gear"></i>
            </button>
        </div>

        <div id="programacaoBuscaAvancada" class="programacao-advanced-panel" hidden>
            <label>
                <span>OS</span>
                <input class="programacao-avancado-campo" data-campo="os" type="text" placeholder="Numero">
            </label>
            <label>
                <span>Cliente</span>
                <input class="programacao-avancado-campo" data-campo="cliente" type="text" placeholder="Empresa">
            </label>
            <label>
                <span>Cidade</span>
                <input class="programacao-avancado-campo" data-campo="cidade" type="text" placeholder="Local">
            </label>
            <label>
                <span>Colaborador</span>
                <input class="programacao-avancado-campo" data-campo="colaborador" type="text" placeholder="Nome">
            </label>
            <label>
                <span>Status</span>
                <select class="programacao-avancado-campo" data-campo="status">
                    <option value="">Todos</option>
                    <option value="sem responsavel">Sem responsavel</option>
                    <option value="aguardando">Aguardando</option>
                    <option value="em execucao">Em execucao</option>
                    <option value="parado">Parado</option>
                    <option value="concluido">Concluido</option>
                    <option value="em espera">Em espera</option>
                    <option value="cancelado">Cancelado</option>
                </select>
            </label>
            <button id="programacaoLimparFiltros" type="button">
                <i class="fa-solid fa-eraser"></i>
                Limpar filtros
            </button>
        </div>

        <div id="programacaoAjustesPanel" class="programacao-ajustes-panel" hidden>
            <header>
                <i class="fa-solid fa-gear"></i>
                <div>
                    <strong>Ajustes da programação</strong>
                    <span>Preferências salvas neste navegador.</span>
                </div>
            </header>

            <section>
                <h4>Exportar programação</h4>
                <label class="programacao-ajustes-check" for="chkExportarResponsavelProgramacao">
                    <input id="chkExportarResponsavelProgramacao" type="checkbox" checked>
                    <span>
                        <strong>Mostrar responsável da OS</strong>
                        <small>Inclui o responsável no texto exportado para WhatsApp.</small>
                    </span>
                </label>
                <label class="programacao-ajustes-check" for="chkExportarAniversariantesProgramacao">
                    <input id="chkExportarAniversariantesProgramacao" type="checkbox" checked>
                    <span>
                        <strong>Mostrar aniversariantes</strong>
                        <small>Mantém o destaque de aniversário na exportação.</small>
                    </span>
                </label>
                <label class="programacao-ajustes-check" for="chkExportarObsAutomaticasProgramacao">
                    <input id="chkExportarObsAutomaticasProgramacao" type="checkbox">
                    <span>
                        <strong>Adicionar observações automaticamente</strong>
                        <small>Inclui as observações do dia sem perguntar antes.</small>
                    </span>
                </label>
            </section>
        </div>
    </div>
</div>

<div id="modalDataTransferencia" class="modal-overlay-data" style="display:none">
    <div class="modal-content-data">
        <button type="button" class="fechar-modal-data" aria-label="Fechar">&times;</button>
        <h3>Escolha as datas para a transferência</h3>

        <!-- ícone que abre o calendário -->
        <button id="abrirCalendario" type="button" class="icone-calendario" title="Selecionar datas">
            <i class="fa-solid fa-calendar-days"></i>
        </button>

        <!-- input oculto só para o flatpickr “viver” -->
        <input id="datasMultiHidden" type="text" aria-hidden="true"
            style="position:absolute;left:-9999px;opacity:0;width:0;height:0;border:0;padding:0;">

        <!-- pode remover se não quiser mostrar nada -->
        <!-- <div id="resumoDatas" class="texto-aux" style="display:none"></div> -->

        <button id="confirmarTransferencia" class="bt_padrao bt_cad">Confirmar</button>
    </div>
</div>


<div id="modalAnotacao" class="modal" style="display: none;">

    <div class="modal-conteudo modal_anotacao">

        <h2 id="modalTitulo">Anotações</h2>
        <label>Dia da anotação:</label>

        <input type="text" id="dataAnotacaoVisual" readonly class="campo-readonly" />

        <input type="hidden" id="datadiaAnot" />
        <label>Ícone:</label>

        <div id="iconeAnotacao" class="lista-icones">

            <!-- Geral -->
            <span data-icone="📌">📌</span>

            <!-- RH / Colaborador -->
            <span data-icone="🪪">🪪</span>
            <span data-icone="🎓">🎓</span>
            <span data-icone="🗳️">🗳️</span>
            <span data-icone="📝">📝</span>

            <!-- Segurança -->
            <span data-icone="🦺">🦺</span>
            <span data-icone="⚠️">⚠️</span>
            <span data-icone="🔒">🔒</span>

            <!-- Saúde -->
            <span data-icone="🩺">🩺</span>
            <span data-icone="💉">💉</span>
            <span data-icone="💊">💊</span>

            <!-- Engenharia / Elétrica -->
            <span data-icone="⚡">⚡</span>
            <span data-icone="🧰">🧰</span>

            <!-- Financeiro -->
            <span data-icone="💵">💵</span>

            <!-- Transporte -->
            <span data-icone="🚗">🚗</span>
            <span data-icone="🛻">🛻</span>

            <!-- Motivacional -->
            <span data-icone="🚀">🚀</span>
            <span data-icone="⭐">⭐</span>

        </div>

        <input type="hidden" id="datadiaAnot">

        <label>Texto:</label>

        <input type="text" id="anotacaoTexto">

        <button id="btnAdicionarAnotacao" class="bt_padrao bt_cad">
            + Adicionar anotação
        </button>

        <!-- LISTA -->
        <div class="lista-anotacoes">


        </div>

        <div class="modal-botoes">

            <button id="btnCancelarAnotacoes" class="bt_padrao bt_cancel">
                Cancelar
            </button>

        </div>

    </div>

</div>
