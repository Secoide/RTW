<div class="menu_Perfil" aria-label="Menu do usuario">
    <div class="perfil-avatar-area">
        <img id="fotoavatarPerfil" class="tb_fotoColab" src="/imagens/fotoperfil/user-default.jpg?v=null" onerror="this.src='/imagens/user-default.webp'">
        <span id="perfil-notification-badge" class="perfil-notification-badge">0</span>
    </div>

    <div class="menuSuperiorDir">
        <div class="perfil-meta">
            <span class="perfil-kicker">Perfil</span>
            <a id="bt_perfilhome" class="nomePerfil" title="Abrir perfil">-</a>
        </div>

        <div class="perfil-actions">
            <button id="notification-container" type="button" title="Notificacoes">
                <i class="fa fa-bell notif"></i>
                <span id="notification-count">0</span>
            </button>

            <a id="btnPreferenciasUsuario" class="perfil-action" title="Preferencias do usuario">
                <i class="fa-solid fa-gear"></i>
            </a>

            <a class="bt_menuSair perfil-action" id="btnLogout" href="#" title="Sair">
                <i class="fa-solid fa-arrow-right-from-bracket"></i>
            </a>
        </div>
    </div>

    <div id="notification-list" class="notification-lista">
        <div class="notification-empty">Nenhuma notificacao.</div>
    </div>
</div>
